name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAYMAH Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Prepare Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept Android SDK licences
      - name: Accept Android SDK licences
        run: |
          yes | sdkmanager --licenses || true

      # 5. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 6. Check repository contents
      - name: Inspect repository
        run: |
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Android/Gradle files:"
          find . -maxdepth 4 \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" \
          \) -print

      # 7. Check the uploaded source ZIP
      - name: Check FAYMAH source ZIP
        run: |
          if [ ! -f "FaymahAI_v1_2_LiveBackend.zip" ]; then
            echo "ERROR: FaymahAI_v1_2_LiveBackend.zip was not found."
            exit 1
          fi

          ls -lh FaymahAI_v1_2_LiveBackend.zip

      # 8. Extract FAYMAH source
      - name: Extract FAYMAH source
        run: |
          rm -rf app-source
          mkdir -p app-source

          unzip -o FaymahAI_v1_2_LiveBackend.zip -d app-source

          echo "Extracted files:"
          find app-source -maxdepth 5 -type f | head -100

      # 9. Locate Android project
      - name: Locate Android project
        id: android_project
        run: |
          PROJECT_DIR=""

          if [ -f "app-source/gradlew" ]; then
            PROJECT_DIR="app-source"
          else
            FOUND=$(find app-source -type f -name "gradlew" -print -quit)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find Gradle Android project."
            echo "Searching for Gradle project files:"
            find app-source -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 10. Make Gradle wrapper executable
      - name: Prepare Gradle
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --version
          fi

      # 11. Build Android APK
      - name: Build FAYMAH APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 12. Find generated APK
      - name: Find APK
        run: |
          echo "Searching for APK files..."

          find app-source \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app-source -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK successfully generated."

      # 13. Upload APK to GitHub Actions
      - name: Upload FAYMAH APK
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-Android-APK
          path: |
            app-source/**/*.apk
          if-no-files-found: error
          retention-days: 30
