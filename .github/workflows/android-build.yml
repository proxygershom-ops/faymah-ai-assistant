name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAYMAH Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ---------------------------------------------------------
      # 4. Accept Android SDK licences
      # ---------------------------------------------------------
      - name: Accept Android SDK licences
        run: |
          yes | sdkmanager --licenses || true

      # ---------------------------------------------------------
      # 5. Install Android SDK packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 6. Show Java / Android / Gradle environment
      # ---------------------------------------------------------
      - name: Show build environment
        run: |
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "SDK PACKAGES"
          echo "=========================================="
          sdkmanager --list_installed || true

      # ---------------------------------------------------------
      # 7. Check source ZIP
      # ---------------------------------------------------------
      - name: Check FAYMAH source ZIP
        shell: bash
        run: |
          echo "=========================================="
          echo "CHECKING FAYMAH SOURCE ZIP"
          echo "=========================================="

          if [ ! -f "FaymahAI_v1_2_LiveBackend.zip" ]; then
            echo ""
            echo "ERROR: FaymahAI_v1_2_LiveBackend.zip was NOT found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh FaymahAI_v1_2_LiveBackend.zip

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l FaymahAI_v1_2_LiveBackend.zip | head -200

      # ---------------------------------------------------------
      # 8. Extract source ZIP
      # ---------------------------------------------------------
      - name: Extract FAYMAH source
        shell: bash
        run: |
          echo "=========================================="
          echo "EXTRACTING FAYMAH SOURCE"
          echo "=========================================="

          rm -rf app-source
          mkdir -p app-source

          unzip -o FaymahAI_v1_2_LiveBackend.zip -d app-source

          echo ""
          echo "EXTRACTION COMPLETE."

          echo ""
          echo "TOP-LEVEL CONTENTS:"
          find app-source -maxdepth 2 -type f -print | head -200

      # ---------------------------------------------------------
      # 9. Locate Android Gradle project
      # ---------------------------------------------------------
      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          echo "=========================================="
          echo "LOCATING ANDROID GRADLE PROJECT"
          echo "=========================================="

          PROJECT_DIR=""

          # First preference: Gradle wrapper
          FOUND_WRAPPER=$(find app-source \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -n "$FOUND_WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$FOUND_WRAPPER")"
            echo "Found Gradle wrapper:"
            echo "$FOUND_WRAPPER"

          else
            echo "No gradlew found."

            # Second preference: settings.gradle
            FOUND_SETTINGS=$(find app-source \
              -type f \
              \( \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit)

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
              echo "Found Gradle settings file:"
              echo "$FOUND_SETTINGS"
            fi
          fi

          # Final validation
          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=========================================="

            echo ""
            echo "All Gradle-related files found:"
            find app-source \
              -type f \
              \( \
                -name "gradlew" -o \
                -name "gradlew.bat" -o \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" -o \
                -name "build.gradle" -o \
                -name "build.gradle.kts" \
              \) \
              -print

            echo ""
            echo "Directory structure:"
            find app-source -maxdepth 5 -type d -print | head -300

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "PROJECT CONTENTS:"
          find "$PROJECT_DIR" -maxdepth 3 -type f -print | head -300

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 10. Prepare Gradle
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARING GRADLE"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

            chmod +x ./gradlew

            echo ""
            echo "Gradle wrapper version:"
            ./gradlew --version

          else

            echo "Gradle wrapper NOT found."

            echo "Installing system Gradle..."

            sudo apt-get update
            sudo apt-get install -y gradle

            echo ""
            echo "System Gradle version:"
            gradle --version

          fi

      # ---------------------------------------------------------
      # 11. Show Android project configuration
      # ---------------------------------------------------------
      - name: Inspect Android Gradle configuration
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID GRADLE CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "settings.gradle files:"
          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) \
            -print

          echo ""
          echo "build.gradle files:"
          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) \
            -print

          echo ""
          echo "gradle.properties:"
          find . \
            -maxdepth 4 \
            -type f \
            -name "gradle.properties" \
            -print

          echo ""
          echo "Android manifests:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print

      # ---------------------------------------------------------
      # 12. Build Debug APK
      # ---------------------------------------------------------
      - name: Build FAYMAH APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "STARTING FAYMAH APK BUILD"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --info

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --info

          fi

      # ---------------------------------------------------------
      # 13. Find APK
      # ---------------------------------------------------------
      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find app-source \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK count:"

          find app-source \
            -type f \
            -name "*.apk" \
            | wc -l

      # ---------------------------------------------------------
      # 14. Copy APK to staging directory
      # ---------------------------------------------------------
      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARING APK ARTIFACT"
          echo "=========================================="

          rm -rf apk-artifact
          mkdir -p apk-artifact

          APK_COUNT=$(find app-source \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          find app-source \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-artifact/ \;

          echo ""
          echo "APK FILES:"
          ls -lh apk-artifact

      # ---------------------------------------------------------
      # 15. Upload APK
      # ---------------------------------------------------------
      - name: Upload FAYMAH Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-Android-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
          retention-days: 30
