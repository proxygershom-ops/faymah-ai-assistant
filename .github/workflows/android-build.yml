name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAYMAH Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check source ZIP
        shell: bash
        run: |
          test -f "FaymahAI_v1_2_LiveBackend.zip" || {
            echo "ERROR: FaymahAI_v1_2_LiveBackend.zip not found."
            exit 1
          }
          ls -lh "FaymahAI_v1_2_LiveBackend.zip"

      - name: Extract FAYMAH source
        shell: bash
        run: |
          rm -rf app-source
          mkdir -p app-source
          unzip -o "FaymahAI_v1_2_LiveBackend.zip" -d app-source
          find app-source -maxdepth 5 -type f | head -200

      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          PROJECT_DIR="$(find app-source -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find app-source -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find app-source -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \) -print
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Verify project configuration
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 4 -type f | sort | head -250

          echo "=== gradle.properties ==="
          if [ -f gradle.properties ]; then
            cat gradle.properties
          fi

          echo "=== Android configuration ==="
          grep -nE 'compileSdk|targetSdk|minSdk|namespace|versionName' \
            app/build.gradle.kts || true

      - name: Build FAYMAH debug APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=== GENERATED APK FILES ==="
          find app-source -type f -name '*.apk' -print

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          rm -rf apk-artifact
          mkdir -p apk-artifact

          find app-source -type f -name '*.apk' \
            -exec cp {} apk-artifact/ \;

          test -n "$(find apk-artifact -type f -name '*.apk' -print -quit)" || {
            echo "ERROR: No APK was generated."
            exit 1
          }

          ls -lh apk-artifact

      - name: Upload FAYMAH Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-Android-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
          retention-days: 30
