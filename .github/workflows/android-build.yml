name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0'

      - name: Check source ZIP
        run: |
          ls -lh
          test -f FaymahAI_v1_2_LiveBackend.zip

      - name: Unpack FAYMAH source
        run: |
          rm -rf app-source
          mkdir app-source
          unzip -o FaymahAI_v1_2_LiveBackend.zip -d app-source
          find app-source -maxdepth 3 -type f | head -50

      - name: Build debug APK
        working-directory: app-source/FaymahAI
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-debug-apk
          path: app-source/FaymahAI/app/build/outputs/apk/debug/*.apk
