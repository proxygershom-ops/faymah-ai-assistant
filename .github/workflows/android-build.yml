name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAYMAH Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Set up Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 4. Accept Android SDK licences
      # ---------------------------------------------------------
      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      # ---------------------------------------------------------
      # 5. Install Android SDK API 36
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 6. Display build environment
      # ---------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "INSTALLED SDK PACKAGES"
          echo "=========================================="
          sdkmanager --list_installed || true

      # ---------------------------------------------------------
      # 7. Check FAYMAH source ZIP
      # ---------------------------------------------------------
      - name: Check FAYMAH source ZIP
        shell: bash
        run: |
          echo "=========================================="
          echo "CHECKING FAYMAH SOURCE ZIP"
          echo "=========================================="

          if [ ! -f "FaymahAI_v1_2_LiveBackend.zip" ]; then
            echo ""
            echo "ERROR: FaymahAI_v1_2_LiveBackend.zip was NOT found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh FaymahAI_v1_2_LiveBackend.zip

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l FaymahAI_v1_2_LiveBackend.zip | head -200

      # ---------------------------------------------------------
      # 8. Extract FAYMAH source
      # ---------------------------------------------------------
      - name: Extract FAYMAH source
        shell: bash
        run: |
          echo "=========================================="
          echo "EXTRACTING FAYMAH SOURCE"
          echo "=========================================="

          rm -rf app-source
          mkdir -p app-source

          unzip -o FaymahAI_v1_2_LiveBackend.zip -d app-source

          echo ""
          echo "EXTRACTION COMPLETE."

          echo ""
          echo "EXTRACTED FILES:"
          find app-source -maxdepth 5 -type f -print | head -300

      # ---------------------------------------------------------
      # 9. Locate Android Gradle project
      # ---------------------------------------------------------
      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          echo "=========================================="
          echo "LOCATING ANDROID GRADLE PROJECT"
          echo "=========================================="

          PROJECT_DIR=""

          # First preference: Gradle wrapper
          FOUND_WRAPPER=$(find app-source \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -n "$FOUND_WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$FOUND_WRAPPER")"

            echo "Gradle wrapper found:"
            echo "$FOUND_WRAPPER"

          else
            echo "No Gradle wrapper found."

            # Second preference: settings.gradle / settings.gradle.kts
            FOUND_SETTINGS=$(find app-source \
              -type f \
              \( \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit)

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"

              echo "Gradle settings file found:"
              echo "$FOUND_SETTINGS"
            fi
          fi

          # Validate project
          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=========================================="

            echo ""
            echo "Gradle files found:"
            find app-source \
              -type f \
              \( \
                -name "gradlew" -o \
                -name "gradlew.bat" -o \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" -o \
                -name "build.gradle" -o \
                -name "build.gradle.kts" \
              \) \
              -print

            echo ""
            echo "Directory structure:"
            find app-source -maxdepth 5 -type d -print | head -300

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "PROJECT CONTENTS:"
          find "$PROJECT_DIR" -maxdepth 4 -type f -print | head -300

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 10. Inspect Gradle configuration
      # ---------------------------------------------------------
      - name: Inspect Android Gradle configuration
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID GRADLE CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Settings files:"
          find . \
            -type f \
            \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) \
            -print

          echo ""
          echo "Build files:"
          find . \
            -type f \
            \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) \
            -print

          echo ""
          echo "Gradle properties:"
          find . \
            -type f \
            -name "gradle.properties" \
            -print

          echo ""
          echo "Android manifests:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print

      # ---------------------------------------------------------
      # 11. Prepare Gradle
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARING GRADLE"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper found."

            chmod +x ./gradlew

            echo ""
            echo "Gradle version:"
            ./gradlew --version

          else

            echo "Gradle wrapper NOT found."

            echo ""
            echo "Installing Gradle from Ubuntu repositories..."

            sudo apt-get update
            sudo apt-get install -y gradle

            echo ""
            echo "System Gradle version:"
            gradle --version

          fi

      # ---------------------------------------------------------
      # 12. Verify Android SDK configuration
      # ---------------------------------------------------------
      - name: Verify Android SDK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "VERIFYING ANDROID SDK"
          echo "=========================================="

          if [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
            echo "Android API 36: FOUND"
          else
            echo "ERROR: Android API 36 was not installed."
            exit 1
          fi

          if [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Build Tools 36.0.0: FOUND"
          else
            echo "ERROR: Build Tools 36.0.0 was not installed."
            exit 1
          fi

      # ---------------------------------------------------------
      # 13. Build FAYMAH Debug APK
      # ---------------------------------------------------------
      - name: Build FAYMAH APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "STARTING FAYMAH APK BUILD"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --info

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --info

          fi

      # ---------------------------------------------------------
      # 14. Find generated APK
      # ---------------------------------------------------------
      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          find app-source \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK COUNT:"

          find app-source \
            -type f \
            -name "*.apk" \
            | wc -l

      # ---------------------------------------------------------
      # 15. Prepare APK artifact
      # ---------------------------------------------------------
      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARING APK ARTIFACT"
          echo "=========================================="

          rm -rf apk-artifact
          mkdir -p apk-artifact

          APK_COUNT=$(find app-source \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          find app-source \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-artifact/ \;

          echo ""
          echo "APK FILES READY FOR UPLOAD:"
          ls -lh apk-artifact

      # ---------------------------------------------------------
      # 16. Upload APK to GitHub Actions
      # ---------------------------------------------------------
      - name: Upload FAYMAH Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-Android-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
          retention-days: 30
