name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAYMAH Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Set up Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ---------------------------------------------------------
      # 4. Accept Android SDK licences
      # ---------------------------------------------------------
      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      # ---------------------------------------------------------
      # 5. Install Android SDK API 36
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 6. Show environment
      # ---------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "ANDROID API 36"
          echo "=========================================="

          if [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
            echo "Android API 36 installed successfully."
          else
            echo "ERROR: Android API 36 not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BUILD TOOLS 36.0.0"
          echo "=========================================="

          if [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Build Tools 36.0.0 installed successfully."
          else
            echo "ERROR: Build Tools 36.0.0 not found."
            exit 1
          fi

      # ---------------------------------------------------------
      # 7. Check FAYMAH source ZIP
      # ---------------------------------------------------------
      - name: Check FAYMAH source ZIP
        shell: bash
        run: |
          echo "=========================================="
          echo "CHECKING FAYMAH SOURCE ZIP"
          echo "=========================================="

          if [ ! -f "FaymahAI_v1_2_LiveBackend.zip" ]; then
            echo ""
            echo "ERROR:"
            echo "FaymahAI_v1_2_LiveBackend.zip was NOT found."
            echo ""
            echo "Repository contents:"
            ls -lah
            echo ""
            echo "All ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh FaymahAI_v1_2_LiveBackend.zip

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l FaymahAI_v1_2_LiveBackend.zip | head -200

      # ---------------------------------------------------------
      # 8. Extract FAYMAH source
      # ---------------------------------------------------------
      - name: Extract FAYMAH source
        shell: bash
        run: |
          echo "=========================================="
          echo "EXTRACTING FAYMAH SOURCE"
          echo "=========================================="

          rm -rf app-source
          mkdir -p app-source

          unzip -o FaymahAI_v1_2_LiveBackend.zip -d app-source

          echo ""
          echo "EXTRACTION COMPLETE."

          echo ""
          echo "EXTRACTED DIRECTORY STRUCTURE:"
          find app-source -maxdepth 5 -type d -print | head -200

          echo ""
          echo "EXTRACTED FILES:"
          find app-source -maxdepth 5 -type f -print | head -300

      # ---------------------------------------------------------
      # 9. Locate Android Gradle project
      # ---------------------------------------------------------
      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          echo "=========================================="
          echo "LOCATING ANDROID GRADLE PROJECT"
          echo "=========================================="

          PROJECT_DIR=""

          # Look for settings.gradle.kts first
          FOUND_SETTINGS=$(find app-source \
            -type f \
            -name "settings.gradle.kts" \
            -print \
            -quit)

          if [ -n "$FOUND_SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
            echo "Found settings.gradle.kts:"
            echo "$FOUND_SETTINGS"
          fi

          # Look for settings.gradle if Kotlin DSL was not found
          if [ -z "$PROJECT_DIR" ]; then

            FOUND_SETTINGS=$(find app-source \
              -type f \
              -name "settings.gradle" \
              -print \
              -quit)

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
              echo "Found settings.gradle:"
              echo "$FOUND_SETTINGS"
            fi

          fi

          # Final validation
          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=========================================="

            echo ""
            echo "Gradle files found:"
            find app-source \
              -type f \
              \( \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" -o \
                -name "build.gradle" -o \
                -name "build.gradle.kts" -o \
                -name "gradlew" \
              \) \
              -print

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "PROJECT FILES:"
          find "$PROJECT_DIR" -maxdepth 4 -type f -print | head -300

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 10. Install Gradle 8.11.1
      # ---------------------------------------------------------
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ---------------------------------------------------------
      # 11. Verify Gradle
      # ---------------------------------------------------------
      - name: Verify Gradle
        shell: bash
        run: |
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      # ---------------------------------------------------------
      # 12. Inspect Android project
      # ---------------------------------------------------------
      - name: Inspect Android Gradle configuration
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID GRADLE CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "settings.gradle files:"
          find . \
            -type f \
            \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) \
            -print

          echo ""
          echo "build.gradle files:"
          find . \
            -type f \
            \( \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) \
            -print

          echo ""
          echo "gradle.properties:"
          find . \
            -type f \
            -name "gradle.properties" \
            -print

          echo ""
          echo "AndroidManifest.xml:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print

          echo ""
          echo "Android source:"
          find app/src/main \
            -type f \
            -print || true

      # ---------------------------------------------------------
      # 13. Display important FAYMAH configuration
      # ---------------------------------------------------------
      - name: Check FAYMAH API configuration
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "FAYMAH API CONFIGURATION"
          echo "=========================================="

          if [ -f "gradle.properties" ]; then
            echo ""
            echo "gradle.properties:"
            cat gradle.properties
          fi

          echo ""
          echo "Checking Android build configuration..."

          if grep -R "compileSdk" app/build.gradle.kts 2>/dev/null; then
            echo "compileSdk configuration found."
          fi

          if grep -R "targetSdk" app/build.gradle.kts 2>/dev/null; then
            echo "targetSdk configuration found."
          fi

      # ---------------------------------------------------------
      # 14. Build FAYMAH Debug APK
      # ---------------------------------------------------------
      - name: Build FAYMAH APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "STARTING FAYMAH APK BUILD"
          echo "=========================================="

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Running assembleDebug..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ---------------------------------------------------------
      # 15. Find generated APK
      # ---------------------------------------------------------
      - name: Find generated APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          echo ""
          echo "APK FILES:"

          find app-source \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK COUNT:"

          APK_COUNT=$(find app-source \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "$APK_COUNT"

      # ---------------------------------------------------------
      # 16. Prepare APK artifact
      # ---------------------------------------------------------
      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARING APK ARTIFACT"
          echo "=========================================="

          rm -rf apk-artifact
          mkdir -p apk-artifact

          APK_COUNT=$(find app-source \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          # Copy every generated APK
          find app-source \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-artifact/ \;

          echo ""
          echo "APK FILES READY:"
          ls -lh apk-artifact

      # ---------------------------------------------------------
      # 17. Upload APK
      # ---------------------------------------------------------
      - name: Upload FAYMAH Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-Android-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 18. Build success message
      # ---------------------------------------------------------
      - name: Build completed successfully
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "FAYMAH APK BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "The FAYMAH Android APK has been built."
          echo ""
          echo "Artifact:"
          echo "FAYMAH-Android-APK"
          echo ""
          echo "Download it from the GitHub Actions Artifacts section."
