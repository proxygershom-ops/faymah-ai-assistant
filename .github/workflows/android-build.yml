name: Build FAYMAH Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FAYMAH Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Check FAYMAH ZIP
        shell: bash
        run: |
          if [ ! -f "FaymahAI_v1_2_LiveBackend.zip" ]; then
            echo "ERROR: FAYMAH ZIP NOT FOUND"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "FAYMAH ZIP FOUND:"
          ls -lh FaymahAI_v1_2_LiveBackend.zip

      - name: Extract FAYMAH project
        shell: bash
        run: |
          rm -rf app-source
          mkdir -p app-source

          unzip -o FaymahAI_v1_2_LiveBackend.zip -d app-source

          echo "=== EXTRACTED FILES ==="
          find app-source -maxdepth 5 -type f -print

      - name: Locate Android project
        id: android_project
        shell: bash
        run: |

          PROJECT_DIR=""

          SETTINGS_KTS=$(find app-source \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_KTS")"
          fi

          if [ -z "$PROJECT_DIR" ]; then

            SETTINGS_GRADLE=$(find app-source \
              -type f \
              -name "settings.gradle" \
              -print -quit)

            if [ -n "$SETTINGS_GRADLE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_GRADLE")"
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be located."
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Verify Gradle
        shell: bash
        run: |
          gradle --version

      - name: Verify FAYMAH Android project
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |

          echo "=== PROJECT DIRECTORY ==="
          pwd

          echo "=== SETTINGS ==="
          cat settings.gradle.kts

          echo "=== ROOT BUILD ==="
          cat build.gradle.kts

          echo "=== APP BUILD ==="
          cat app/build.gradle.kts

          echo "=== GRADLE PROPERTIES ==="
          cat gradle.properties

      - name: Build FAYMAH APK
        working-directory: ${{ steps.android_project.outputs.project_dir }}
        shell: bash
        run: |

          echo "================================"
          echo "BUILDING FAYMAH APK"
          echo "================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find generated APK
        if: always()
        shell: bash
        run: |

          echo "=== APK FILES ==="

          find app-source \
            -type f \
            -name "*.apk" \
            -print

      - name: Prepare APK
        if: success()
        shell: bash
        run: |

          rm -rf apk-artifact
          mkdir -p apk-artifact

          find app-source \
            -type f \
            -name "*.apk" \
            -exec cp {} apk-artifact/ \;

          echo "=== FINAL APK ==="
          ls -lh apk-artifact

      - name: Upload FAYMAH APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAYMAH-Android-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build successful
        if: success()
        run: |
          echo "================================"
          echo "FAYMAH APK BUILD SUCCESSFUL"
          echo "================================"
